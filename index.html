<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NINE STUDIO - 超现实数字视觉</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-light: #fafafa; 
            --text-main: #111111;  
        }
        body { 
            background-color: var(--bg-light); 
            color: var(--text-main); 
            font-family: 'Noto Sans SC', sans-serif; 
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        .font-tech-en { 
            font-family: 'Space Grotesk', sans-serif; 
            letter-spacing: 0.05em;
        }
        .noise-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 50;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
        }
        .gradient-text-fluid {
            background: linear-gradient(90deg, #9ca3af 0%, #d1d5db 50%, #9ca3af 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            animation: gradientShine 4s linear infinite;
        }
        @keyframes gradientShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .work-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.02);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1.5rem;
            /* 16:9 比例 */
            aspect-ratio: 16 / 9;
        }
        .work-card:hover {
            border-color: rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.06);
            transform: translateY(-5px);
        }
        
        /* 隐藏元素的类 */
        .hidden-card {
            display: none !important;
        }
        
        /* 过滤器按钮样式 */
        .filter-btn {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.3s;
            background: transparent;
            color: #666;
            font-weight: 500;
        }
        .filter-btn:hover {
            border-color: #111;
            color: #111;
        }
        .filter-btn.active {
            background: #111;
            color: #fff;
            border-color: #111;
        }

        .section-heading {
            border-left: 3px solid var(--text-main);
            padding-left: 1rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: baseline;
        }
    </style>
</head>
<body>
    <div class="noise-overlay"></div>
    
    <!-- 导航栏 -->
    <nav class="flex justify-between items-end py-10 px-8 max-w-[1400px] mx-auto relative z-10">
        <div class="flex flex-col">
            <h1 class="text-3xl font-black font-tech-en text-gray-900 tracking-wider">
                NINE<span class="text-gray-400 ml-1">STUDIO</span>
            </h1>
            <span class="text-[0.65rem] font-bold tracking-[0.2em] text-gray-500 mt-1 uppercase font-tech-en">
                Surreal Digital Vision · 超现实视觉
            </span>
        </div>
    </nav>

    <!-- 核心视觉文案区 -->
    <header class="max-w-[1400px] mx-auto px-8 pt-16 pb-24 text-left relative z-10">
        <h2 class="text-4xl md:text-5xl lg:text-[4.5rem] font-black text-gray-900 tracking-tight leading-[1.2] mb-4">
            降维打击传统实拍。<br class="md:hidden">
            <span class="gradient-text-fluid inline-block mt-3 text-4xl sm:text-5xl md:text-6xl lg:text-[5rem]">
                用 20% 的预算，生成 100% 的超现实视觉暴击。
            </span>
        </h2>
        <p class="text-sm md:text-base text-gray-500 max-w-2xl leading-relaxed tracking-wide font-light mt-6">
            NINE STUDIO 接入全景 AI 算力，让每一个狂热灵感精准显影。
        </p>
    </header>

    <main class="max-w-[1400px] mx-auto px-8 pb-32 relative z-10 space-y-16">
        
        <!-- 作品展示区标题与筛选器 -->
        <section id="works">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-10 gap-6">
                <div class="section-heading mb-0">
                    <div class="flex flex-col">
                        <h2 class="text-xl md:text-2xl font-bold tracking-widest text-gray-900">精选大片</h2>
                        <span class="text-[0.65rem] text-gray-400 uppercase tracking-[0.2em] font-tech-en mt-1">Featured Works</span>
                    </div>
                </div>
                
                <!-- ！！！ 新增的分类筛选器 ！！！ -->
                <div class="flex flex-wrap gap-3" id="filters">
                    <button class="filter-btn active" data-filter="all">全部作品</button>
                    <!-- 在这里修改或增加你的分类名称 -->
                    <button class="filter-btn" data-filter="歌曲MV">歌曲MV</button>
                    <button class="filter-btn" data-filter="电商品牌">电商品牌</button>
                    <button class="filter-btn" data-filter="影视剧">影视剧</button>
                </div>
            </div>
            
            <div id="works-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-10">
                <p class="text-gray-400 text-sm">正在接入系统数据...</p>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer id="contact" class="border-t border-black/5 py-16 text-center text-xs text-gray-400 relative z-10 font-tech-en">
        <!-- ！！！ 联系方式修改区 ！！！ -->
        <!-- 把 yourname@example.com 换成你的真实邮箱 -->
        <a href="mailto:yourname@example.com" class="inline-block border border-black/10 text-gray-900 px-10 py-4 hover:border-gray-900 hover:text-gray-900 hover:bg-gray-50 transition-all duration-300 font-bold tracking-widest uppercase mb-10">
            Access Terminal (联系我们)
        </a>
        <p class="tracking-widest">&copy; 2026 NINE STUDIO. ALL SYSTEMS SECURE.</p>
    </footer>

    <!-- CMS 数据读取、渲染与筛选脚本 -->
    <script>
        let allWorksData = []; // 用来保存从 JSON 读取到的所有数据

        async function loadWorks() {
            try {
                // 读取 works.json 数据
                // 注意：为了解决 GitHub Pages 的缓存问题，这里加了一个时间戳强制拉取最新数据
                const response = await fetch('works.json?t=' + new Date().getTime());
                const data = await response.json();
                allWorksData = data.items; 
                
                renderWorks('all'); // 初次加载时显示所有作品
                setupFilters();     // 初始化筛选按钮的点击事件

            } catch (error) {
                console.log('读取数据失败', error);
                document.getElementById('works-grid').innerHTML = '<p class="text-gray-400 text-sm">数据加载失败，请检查 works.json 文件格式。</p>';
            }
        }

        // 渲染卡片的函数
        function renderWorks(filterType) {
            const grid = document.getElementById('works-grid');
            grid.innerHTML = ''; // 清空之前的卡片

            allWorksData.forEach(item => {
                // 筛选逻辑：如果当前选的不是"all"，且作品的 category 不包含选中的分类词，则跳过不渲染
                // （注意：为了容错，这里使用了 .includes() 模糊匹配，忽略大小写）
                if (filterType !== 'all') {
                    if (!item.category.toLowerCase().includes(filterType.toLowerCase())) {
                        return; 
                    }
                }

                let mediaContent = '';
                // 如果有视频链接，就播放视频；否则显示封面图
                if (item.video && item.video.trim() !== "") {
                    mediaContent = `<video src="${item.video}" autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover z-0 transition-transform duration-700 group-hover:scale-105 opacity-80 group-hover:opacity-100"></video>`;
                } else if (item.cover && item.cover.trim() !== "") {
                    mediaContent = `<img src="${item.cover}" alt="${item.title}" class="absolute inset-0 w-full h-full object-cover z-0 transition-transform duration-700 group-hover:scale-105 opacity-80 group-hover:opacity-100">`;
                }

                const card = `
                <div class="work-card group cursor-pointer">
                    ${mediaContent}
                    <div class="absolute inset-0 bg-gradient-to-t from-white/90 via-white/10 to-transparent z-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                    <div class="relative z-10 mt-auto">
                        <h3 class="card-title text-lg md:text-xl font-bold text-gray-900 transition-colors">${item.title}</h3>
                        <p class="card-desc font-tech-en text-[0.65rem] text-gray-600 uppercase tracking-widest mt-1">${item.category}</p>
                    </div>
                </div>
                `;
                grid.insertAdjacentHTML('beforeend', card);
            });
            
            // 如果筛选后没有结果的提示
            if(grid.innerHTML === '') {
                 grid.innerHTML = '<p class="text-gray-400 text-sm">该分类下暂无作品。</p>';
            }
        }

        // 设置筛选按钮点击事件的函数
        function setupFilters() {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    // 移除所有按钮的 active 状态
                    buttons.forEach(b => b.classList.remove('active'));
                    // 给当前点击的按钮加上 active 状态
                    this.classList.add('active');
                    
                    // 获取按钮上的 data-filter 属性值，并重新渲染
                    const filterValue = this.getAttribute('data-filter');
                    renderWorks(filterValue);
                });
            });
        }

        loadWorks();
    </script>
</body>
</html>
